[tool.ruff]
# Labs del módulo AE-2026: scripts cortos y legibles, sin magia.
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "venv",
  "level-*/*/target",
  "level-*/*/logs",
  "level-*/*/dbt_packages",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
