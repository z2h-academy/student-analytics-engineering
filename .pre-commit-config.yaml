# ============================================================
# AE-2026 · hooks locales (pre-commit install)
# Ruff para scripts Python, SQLFluff para SQL puro del nivel 0,
# yamllint para YAML de dbt/CI. Los modelos dbt con Jinja se
# validan con `dbt parse` (no con SQLFluff) para no duplicar
# resolución de macros/refs.
# ============================================================
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^nivel-.*/scripts/.*\.py$
      - id: ruff-format
        files: ^nivel-.*/scripts/.*\.py$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
