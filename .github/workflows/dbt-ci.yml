name: dbt CI

# CI de acompañamiento: el repo arranca solo con infraestructura, así
# que cada job detecta qué niveles existen y omite el resto. A medida
# que se agregan labs, el CI empieza a validarlos sin tocar el workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + SQLFluff + yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Ruff (scripts de los niveles)
        run: |
          shopt -s nullglob
          files=(level-*/scripts/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Sin scripts Python todavía: se omite ruff."
            exit 0
          fi
          ruff check .

      - name: SQLFluff parse (SQL puro del nivel 0)
        run: |
          shopt -s nullglob
          files=(level-*/sql/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Sin SQL todavía: se omite SQLFluff."
            exit 0
          fi
          sqlfluff parse "${files[@]}" --dialect snowflake --templater raw

      - name: yamllint
        run: yamllint -c .yamllint .

  parse:
    name: dbt parse (parser v2, sin warehouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parse de los proyectos existentes
        env:
          # Valores dummy: `dbt parse` no abre conexión a Snowflake.
          SNOWFLAKE_ACCOUNT: dummy
          SNOWFLAKE_USER: dummy
          SNOWFLAKE_PASSWORD: dummy
          SNOWFLAKE_ROLE: AE_ROLE
          SNOWFLAKE_WAREHOUSE: AE_WH
          SNOWFLAKE_DATABASE: AE_ANALYTICS
        run: |
          set -euo pipefail
          found=0
          for proj in level-*/dbt_project; do
            [ -f "$proj/dbt_project.yml" ] || continue
            found=1
            echo "== parse $proj =="
            cp "$proj/profiles.yml.example" "$proj/profiles.yml"
            dbt parse \
              --project-dir "$proj" \
              --profiles-dir "$proj" \
              --no-partial-parse
          done
          if [ "$found" -eq 0 ]; then
            echo "Sin proyectos dbt todavía: se omite dbt parse."
          fi

  build:
    name: dbt build (Snowflake, manual)
    # Requiere los secrets SNOWFLAKE_* configurados en el repo.
    # Se corre a demanda para no exponer credenciales en PRs de forks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build de los proyectos existentes
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          set -euo pipefail
          found=0
          for proj in level-*/dbt_project; do
            [ -f "$proj/dbt_project.yml" ] || continue
            found=1
            echo "== build $proj =="
            cp "$proj/profiles.yml.example" "$proj/profiles.yml"
            dbt build \
              --project-dir "$proj" \
              --profiles-dir "$proj" \
              --target dev
          done
          if [ "$found" -eq 0 ]; then
            echo "Sin proyectos dbt todavía: se omite dbt build."
          fi
